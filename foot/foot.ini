[main]
font=JetBrainsMono Nerd Font:size=10
pad=7x7
box-drawings-uses-font-glyphs=no
line-height=14

include=~/.config/foot/dank-colors.ini

[colors-dark]
alpha=0.85

[key-bindings]
spawn-terminal=Control+Shift+N
show-urls-launch=Control+Shift+O
show-urls-copy=Control+Shift+U
show-urls-persistent=Control+Shift+P
search-start=Control+Shift+R

[search-bindings]
extend-backward-char=Alt+h
extend-char=Alt+l
extend-line-up=Alt+k
extend-line-down=Alt+j
extend-backward-to-word-boundary=Alt+b
extend-to-word-boundary=Alt+w
extend-backward-to-next-whitespace=Alt+asciicircum Alt+Shift+6
extend-to-next-whitespace=Alt+dollar Alt+Shift+4

[url]
launch=xdg-open ${url}
osc8-underline=always
